<!doctype html>
<html lang="zu-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7f2" />
    <meta
      name="description"
      content="Isivivinyo samarekhodi acacile okonga eqenjini."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/shell.css" />
    <title>StockOnChain</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/zu" aria-label="Ikhaya le-StockOnChain">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>StockOnChain</span>
        </a>
        <details class="language-control">
          <summary>Ulimi</summary>
          <nav class="language-options" aria-label="Ulimi">
            <a href="/" lang="en-ZA">English</a>
            <a href="/zu" lang="zu-ZA" aria-current="page">isiZulu</a>
          </nav>
        </details>
      </header>
      <section class="welcome" aria-labelledby="page-title">
        <div class="welcome-copy">
          <span class="status"><span aria-hidden="true"></span>Isivivinyo</span>
          <h1 id="page-title">StockOnChain</h1>
          <p class="tagline">Bona kangcono iqembu lakho lokonga.</p>
          <p class="disclaimer">
            Lesi sivivinyo asixhunyiwe emalini noma ekutshalweni kwezimali.
          </p>
          <div class="login-placeholder">
            <button type="button" disabled>
              Ngena ngemvume (kuvela ku-I-01)
            </button>
          </div>
          <details class="advanced-wallet">
            <summary>Okuthuthukile</summary>
            <p>
              Ukuxhuma kuFreighter akuphoqelekile futhi kusebenzisa iStellar
              Testnet kuphela.
            </p>
            <a href="/advanced-wallet?lang=zu">Xhuma kuFreighter</a>
          </details>
        </div>
        <div class="welcome-stamp" aria-hidden="true">
          <span>S</span><span>SC</span>
        </div>
      </section>
    </main>
    <script src="/shell.js" defer></script>
  </body>
</html>
